[package]
name = "semantic-image-browser"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "semantic_image_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lancedb = "0.23.1"
tokio = { version = "1", features = ["rt-multi-thread"] }
ort = { version = "2.0.0-rc.11", default-features = false, features = ["load-dynamic"] }
tauri-plugin-fs = "2.4.5"
tauri-plugin-dialog = "2"
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "avif"] }
png = "0.18"
arrow-schema = "56"
arrow-array = "56"
futures = "0.3"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
webp = "0.3"
ndarray = "0.17.2"
tokenizers = "0.22.2"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
zip = "7.1"
flate2 = "1.1"
tar = "0.4"
turbojpeg = "1.3.3"
fast_image_resize = "5.5.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader"] }

